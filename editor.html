<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blender</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  body { margin: 0; background: #202020; color: #f5f5f5; font: 1rem system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; outline: none; }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: #202020; }
  #loading[hidden] { display: none; }
  #status { margin: 0.75rem 1rem; }
  progress { width: min(12rem, 60vw); height: 0.35rem; margin: auto; accent-color: #ed872f; }
</style>
<canvas id="gpu" tabindex="0" aria-label="Blender" inert></canvas>
<div id="loading">
  <p id="status" role="status">Loading Blender…</p>
  <progress aria-label="Blender startup"></progress>
</div>
<script type="module">
  import { startEditor } from "./editor.mjs";
  startEditor(/* editor assets */ null);
</script>
</html>
